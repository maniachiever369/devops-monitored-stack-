cat << 'EOF' > .github/workflows/ci-pipeline.yml
name: DevOps CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  code-lint-and-build:
    runs-on: ubuntu-latest

    steps:
    # 1. Pull the code from your GitHub repository onto the runner
    - name: Checkout Code
      uses: actions/checkout@v4

    # 2. Set up Python environment to verify code syntax
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-python-version: '3.9'

    # 3. Perform a syntax check (Linting) to ensure developers didn't make a typo
    - name: Check Python Syntax
      run: |
        python -m compileall app.py

    # 4. Set up Docker Buildx inside the GitHub cloud environment
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    # 5. Test build the Docker image to guarantee your Dockerfile works
    - name: Test Build Docker Image
      uses: docker/build-push-action@v5
      with:
        context: .
        file: ./Dockerfile
        push: false
        tags: devops-test-image:latest
EOF

